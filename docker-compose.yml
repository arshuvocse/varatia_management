services:
  web:
    build:
      context: ./promotionwebandapi
      dockerfile: Dockerfile
    container_name: varatia_web_api
    restart: always
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
    depends_on:
      - mssql
    volumes:
      - web_uploads:/app/uploads
      - web_wwwroot_uploads:/app/wwwroot/uploads

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: varatia_mssql_db
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Shuvo**10
    ports:
      - "14333:1433"
    volumes:
      - mssql_data:/var/opt/mssql/data

volumes:
  mssql_data:
  web_uploads:
  web_wwwroot_uploads:
